<style>
/* ── Keyframes ────────────────────────────────────────────── */
@keyframes mjr-fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0);   }
}

/* ── Layout ───────────────────────────────────────────────── */
.mjr-layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 40px;
  align-items: start;
  margin-top: 44px;
}

/* ── Tab list ─────────────────────────────────────────────── */
.mjr-tabs {
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: sticky;
  top: 24px;
}

.mjr-tab {
  display: block;
  padding: 18px 20px;
  background: #ffffff;
  border: 1.5px solid #e5e7eb;
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
  font-family: 'Nunito Sans', Arial, Helvetica, sans-serif;
  transition:
    border-color .18s ease,
    background   .18s ease,
    box-shadow   .18s ease,
    transform    .14s ease;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.mjr-tab:hover {
  border-color: #9ca3af;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  transform: translateY(-1px);
}
.mjr-tab:active { transform: translateY(0); }
.mjr-tab[aria-selected="true"] {
  border-color: #ab1f2d;
  background: #fff5f5;
  box-shadow: 0 0 0 1px #ab1f2d, 0 4px 20px rgba(171,31,45,.12);
  transform: translateY(-1px);
}

/* Text */
.mjr-tab-title {
  font-size: 15px;
  font-weight: 700;
  color: #0f0f0f;
  letter-spacing: -.015em;
  line-height: 1.25;
  margin-bottom: 5px;
  font-family: 'Nunito Sans', Arial, Helvetica, sans-serif;
}
.mjr-tab-desc {
  font-size: 14px;
  color: #6b7280;
  line-height: 1.55;
  font-weight: 400;
  font-family: 'Nunito Sans', Arial, Helvetica, sans-serif;
}
.mjr-tab[aria-selected="true"] .mjr-tab-desc { color: #ab1f2d; }

/* ── Right panel ──────────────────────────────────────────── */
.mjr-panel {
  background: #ffffff;
  border: 1.5px solid #e5e7eb;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
  transition: box-shadow .2s ease;
  min-height: 200px;
}
.mjr-panel:focus-within {
  box-shadow: 0 6px 32px rgba(0,0,0,.1), 0 2px 6px rgba(0,0,0,.05);
}

/* ── Form wrappers ────────────────────────────────────────── */
.mjr-form-wrap {
  display: none;
}
.mjr-form-wrap.mjr-active {
  display: block;
  animation: mjr-fadeSlideIn .3s ease forwards;
}

/* ── iframe heights — JotForm (general inquiries) ────────── */
.mjr-form-wrap iframe {
  width: 100%;
  border: none;
  display: block;
  height: 1000px;
}
@media (max-width: 935px) {
  .mjr-form-wrap iframe { height: 1280px; }
}
@media (max-width: 860px) {
  .mjr-form-wrap iframe { height: 920px; }
}
@media (max-width: 595px) {
  .mjr-form-wrap iframe { height: 1400px; }
}

/* ── iframe heights — Dynamics form (become a distributor) */
/* Cross-origin, so it can't auto-size. Heights measured from the form
   at each panel width, plus ~60px headroom for font differences.
   The form stacks its fields whenever the iframe is 640px or narrower,
   which happens twice: 861–1062px (two-column page, narrow panel) and
   722px and below (single-column page). Everywhere else fields sit
   side by side. If fields are added to the form, re-measure. */
.mjr-form-wrap.mjr-dyn iframe { height: 1400px; }          /* side by side: ~1341 */
@media (max-width: 1062px) {
  .mjr-form-wrap.mjr-dyn iframe { height: 1930px; }        /* stacked: ~1804–1871 */
}
@media (max-width: 860px) {
  .mjr-form-wrap.mjr-dyn iframe { height: 1400px; }        /* side by side again */
}
@media (max-width: 722px) {
  .mjr-form-wrap.mjr-dyn iframe { height: 1930px; }        /* stacked: ~1804–1871 */
}
@media (max-width: 480px) {
  .mjr-form-wrap.mjr-dyn iframe { height: 2060px; }        /* phones: ~1919–2001 */
}
@media (max-width: 359px) {
  .mjr-form-wrap.mjr-dyn iframe { height: 2160px; }        /* small phones: ~2093 */
}

/* ── Disabled / locked tab ────────────────────────────────── */
.mjr-tab-locked {
  display: block;
  padding: 18px 20px;
  background: #f9fafb;
  border: 1.5px solid #e5e7eb;
  border-radius: 12px;
  text-align: left;
  cursor: not-allowed;
  opacity: .55;
}
.mjr-tab-locked .mjr-tab-title {
  font-size: 15px;
  font-weight: 700;
  color: #6b7280;
  letter-spacing: -.015em;
  line-height: 1.25;
  margin-bottom: 5px;
  font-family: 'Nunito Sans', Arial, Helvetica, sans-serif;
}
.mjr-tab-locked .mjr-tab-login {
  font-size: 14px;
  color: #6b7280;
  line-height: 1.55;
  font-weight: 400;
  font-family: 'Nunito Sans', Arial, Helvetica, sans-serif;
}

/* ── Responsive layout ────────────────────────────────────── */
@media (max-width: 860px) {
  .mjr-layout {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .mjr-tabs {
    position: static;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .mjr-tab-locked {
    grid-column: 1 / -1;
  }
}
@media (max-width: 480px) {
  .mjr-tabs {
    grid-template-columns: 1fr;
  }
  .mjr-tab-locked {
    grid-column: auto;
  }
}
</style>

<!-- ── SCRIPT ─────────────────────────────────────────────── -->
<script>
/* ── Attribution relay ─────────────────────────────────────
   This page is loaded inside an iframe on majesticglove.com. GTM appends
   the visitor's source to THIS page's URL; this block forwards it down to
   the form iframes so it lands in their hidden fields.

   The iframes carry data-src rather than src so they load exactly once,
   with the parameters already attached — a second load would double-count
   form-view events.

   If no parameters arrive, the forms load clean. Don't add a fallback
   value here; GTM already sets one a level up, and two layers guessing
   means a real source can get overwritten by a placeholder.
   ───────────────────────────────────────────────────────── */
(function () {
  var KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'landing_page', 'referrer'];
  var qs = '';

  try {
    var incoming = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();
    KEYS.forEach(function (k) {
      var v = incoming.get(k);
      if (v) out.set(k, v);
    });
    qs = out.toString();
  } catch (e) {
    qs = '';
  }

  // Load the forms regardless of whether attribution was found.
  document.querySelectorAll('iframe[data-src]').forEach(function (f) {
    var base = f.getAttribute('data-src');
    f.src = qs ? base + (base.indexOf('?') > -1 ? '&' : '?') + qs : base;
  });
}());

(function () {
  var tabs = document.querySelectorAll('.mjr-tab[data-intent]');

  function activateTab(key) {
    var activeBtn = document.querySelector('.mjr-tab[data-intent="' + key + '"]');
    if (!activeBtn) return;

    tabs.forEach(function (btn) {
      btn.setAttribute('aria-selected', btn.dataset.intent === key ? 'true' : 'false');
    });

    document.querySelectorAll('.mjr-form-wrap').forEach(function (el) {
      if (el.dataset.jotform === key) {
        el.classList.remove('mjr-active');
        void el.offsetWidth;
        el.classList.add('mjr-active');
      } else {
        el.classList.remove('mjr-active');
      }
    });
  }

  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () { activateTab(btn.dataset.intent); });
  });

  tabs.forEach(function (btn, i) {
    btn.addEventListener('keydown', function (e) {
      var all = Array.from(tabs);
      var next;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = all[(i + 1) % all.length];
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = all[(i - 1 + all.length) % all.length];
      if (next) { next.focus(); activateTab(next.dataset.intent); e.preventDefault(); }
    });
  });

  activateTab('distributor');
}());
</script>
